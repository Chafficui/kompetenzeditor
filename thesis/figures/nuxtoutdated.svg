<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 182" role="img"
     aria-label="Nuxt Release Schedule">
  <title>Nuxt Release Schedule</title>

  <style>
    text { font-family: sans-serif; fill: #333; }
    .label { font-size: 12px; }
    .tick { font-size: 11px; fill: #888; }
    .grid { stroke: #e8e8e8; stroke-width: 1; }
    .today { stroke: #cc4444; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .bar { rx: 2; ry: 2; }
    .eoas { fill: #0A2472; }
    .eol { fill: #1E96FC; }
    .eoes { fill: #CDEBFF; }
    .no-end { fill: #C8C8C8; }
    .no-end-badge { width: 32px; stroke: #ccc; stroke-width: 1; stroke-dasharray: 2,3; }
    .no-end-plus { font-size: 14px; font-weight: bold; fill: white; }
    .legend-icon { width: 14px; height: 14px; rx: 2; ry: 2; }
  </style>

  <!-- Background -->
  <rect width="900" height="182" fill="white"/>

  <!-- Chart area -->
  <g transform="translate(0, 10)">

    <!-- Year grid lines and labels -->
    
    <line class="grid" x1="115.3" y1="0" x2="115.3" y2="112"/>
    <text class="tick" x="115.3" y="128" text-anchor="middle">2019</text>
    
    <line class="grid" x1="216.6" y1="0" x2="216.6" y2="112"/>
    <text class="tick" x="216.6" y="128" text-anchor="middle">2020</text>
    
    <line class="grid" x1="318.2" y1="0" x2="318.2" y2="112"/>
    <text class="tick" x="318.2" y="128" text-anchor="middle">2021</text>
    
    <line class="grid" x1="419.4" y1="0" x2="419.4" y2="112"/>
    <text class="tick" x="419.4" y="128" text-anchor="middle">2022</text>
    
    <line class="grid" x1="520.7" y1="0" x2="520.7" y2="112"/>
    <text class="tick" x="520.7" y="128" text-anchor="middle">2023</text>
    
    <line class="grid" x1="622.0" y1="0" x2="622.0" y2="112"/>
    <text class="tick" x="622.0" y="128" text-anchor="middle">2024</text>
    
    <line class="grid" x1="723.5" y1="0" x2="723.5" y2="112"/>
    <text class="tick" x="723.5" y="128" text-anchor="middle">2025</text>
    
    <line class="grid" x1="824.8" y1="0" x2="824.8" y2="112"/>
    <text class="tick" x="824.8" y="128" text-anchor="middle">2026</text>
    

    <!-- Release rows -->
    
    
    <g transform="translate(0, 0)">
      <text class="label" x="8" y="16" text-anchor="end">4</text>
      
      <rect class="bar eoas" x="777.9" y="0" width="81.60000000000002" height="25"/>
      
      
      
      <rect class="bar no-end-badge no-end" x="859.5" y="0" height="25"/>
      <text class="no-end-plus" x="875.5" y="16" text-anchor="middle">+</text>
      
    </g>
    
    
    <g transform="translate(0, 29)">
      <text class="label" x="8" y="16" text-anchor="end">3</text>
      
      <rect class="bar eoas" x="507.9" y="0" width="270.0" height="25"/>
      
      
      <rect class="bar eol" x="777.9" y="0" width="105.5" height="25"/>
      
      
    </g>
    
    
    <g transform="translate(0, 58)">
      <text class="label" x="8" y="16" text-anchor="end">2</text>
      
      <rect class="bar eoas" x="87.0" y="0" width="420.9" height="25"/>
      
      
      <rect class="bar eol" x="507.9" y="0" width="164.30000000000007" height="25"/>
      
      
    </g>
    
    
    <g transform="translate(0, 87)">
      <text class="label" x="8" y="16" text-anchor="end">1</text>
      
      <rect class="bar eoas" x="16.0" y="0" width="71.0" height="25"/>
      
      
      <rect class="bar eol" x="87.0" y="0" width="101.30000000000001" height="25"/>
      
      
    </g>
    

    <!-- Today marker -->
    <line class="today" x1="859.5" y1="0" x2="859.5" y2="112"/>

    <!-- Legend -->
    <g transform="translate(117, 140)">
      
      <rect class="legend-icon eoas" x="0" y="0"/>
      <text class="label" x="18" y="11">Active Development</text>
      
      <rect class="legend-icon eol" x="240" y="0"/>
      <text class="label" x="258" y="11">Maintenance Support</text>
      
      <rect class="legend-icon no-end" x="480" y="0"/>
      <text class="label" x="498" y="11">No end date published</text>
      
    </g>
  </g>
</svg>
